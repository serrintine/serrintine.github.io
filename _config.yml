# Name of site (displayed in the header)
name: Sailunsi

# Short bio or description (displayed in the header)
description: A goofy goober

# URL of avatar or profile pic
avatar: /images/avatar.png

# Path of site logo (used for SEO)
# Only change the image file itself, not the path!
logo: &logo /images/avatar.png

# Ordered list of categories for portfolio posts
portfolio-categories:
  - Icky
  - Morti
  - Both

portfolio-order:
  - ickymorti1
  - icky1
  - icky3
  - icky4
  - morti1
  - morti2
  - icky2
  - ickymorti2
  - ickymorti3
  - ickymorti4
  - ickymorti5
  - ickymorti6
  - ickymorti7
  - ickymorti8
  - ickymorti9
  - morti3


# Collections for general pages and portfolio posts
collections_dir: pages
collections:
  menu:
    output: true
    permalink: /:title/
  portfolio:
    output: true
    permalink: /:collection/:title/ # Add slugified_categories for Jekyll4.1
  pokemon:
    output: true
    permalink: /:collection/:title/

# Front matter defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "general"
      image: *logo
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "portfolio"
  - scope:
      path: "assets/**/*.pdf"
    values:
      sitemap: false

#
# Flags below are optional
#

# Includes an icon in the footer for each username
footer-links:
  dribbble: 
  email:
  facebook:
  flickr: 
  github: serrintine
  instagram:
  linkedin: sailunsi-chen
  pinterest: 
  rss: # just type anything here for a working RSS icon
  twitter:
  stackoverflow:
  youtube: # channel/<your_long_string> or user/<user-name>
  googleplus: # anything in your profile username that comes after plus.google.com/

# Disqus shortname, entering this will enable commenting on posts
disqus: 

# Enter Google Analytics web tracking code (e.g. UA-2110908-2) to activate tracking
google_analytics: 

# Website URL
# Used for Sitemap.xml and RSS feed
url: http://serrintine.github.io

# Add in the baseurl here, like this: "/repository-name"
baseurl: ""

#
# !! Don't need to change any of the configuration flags below !!
#

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
permalink: /:title/

# Set the Sass partials directory
sass:
  sass_dir: _sass
  style: :compressed # Either :expanded or :compressed

# Use the following plug-ins
gems:
  - jemoji # Emoji please!
  - jekyll-sitemap # Create a sitemap using the official Jekyll sitemap gem

# Exclude these files from production _site
exclude:
    - Gemfile
    - Gemfile.lock
    - LICENSE
    - README.md

theme: jekyll-theme-cayman
